name: Auto Preprocess Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy pyarrow

      - name: Run preprocessing
        run: python "Week 2.py"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add features.csv features.parquet
          git commit -m "Auto update features" || echo "No changes to commit"
          git push
